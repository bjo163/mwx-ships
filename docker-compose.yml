services:
  moonships:
    build:
      context: .
      dockerfile: Dockerfile
    image: moonships:latest
    container_name: moonships-control-plane
    restart: unless-stopped
    ports:
      - "5150:5150"
    environment:
      - LOCO_ENV=production
      - PORT=5150
      - BINDING=0.0.0.0
      - HOST=http://localhost:5150
      - DATABASE_URL=sqlite:///app/data/moonships.sqlite?mode=rwc
      - QUEUE_URL=sqlite:///app/data/moonships.sqlite?mode=rwc
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set to a secure 64-character hex value}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set to a secure random value}
      - LOG_LEVEL=info
    volumes:
      - moonships-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5150/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  moonships-data:
    name: moonships_persistent_data
