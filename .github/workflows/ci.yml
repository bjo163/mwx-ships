name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  backend-checks:
    name: Backend Quality & Tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Format Check
        run: cargo fmt --all -- --check

      - name: Type Check
        run: cargo check --all-targets --all-features

      - name: Test Suite (SQLite)
        run: cargo test --all-targets --all-features

      - name: Strict Clippy Linting
        run: cargo clippy --all-targets --all-features -- -D warnings

  backend-postgres:
    name: Backend Compatibility (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: moonships
          POSTGRES_PASSWORD: moonships_test
          POSTGRES_DB: moonships_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moonships -d moonships_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://moonships:moonships_test@localhost:5432/moonships_test
      RUST_TEST_THREADS: 1
      ENCRYPTION_KEY: dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: PostgreSQL migration and test suite
        run: cargo test --all-targets --all-features

      - name: SQLite to PostgreSQL verified migration drill
        shell: bash
        env:
          PGPASSWORD: moonships_test
          MIGRATION_SQLITE_URL: sqlite:///tmp/moonships-migrate.sqlite?mode=rwc
          MIGRATION_POSTGRES_URL: postgres://moonships:moonships_test@localhost:5432/moonships_migrate
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y -qq sqlite3 postgresql-client

          rm -f /tmp/moonships-migrate.sqlite
          psql -h localhost -U moonships -d postgres             -c "DROP DATABASE IF EXISTS moonships_migrate WITH (FORCE)"
          psql -h localhost -U moonships -d postgres             -c "CREATE DATABASE moonships_migrate"

          LOCO_ENV=development DATABASE_URL="$MIGRATION_SQLITE_URL"             cargo run --quiet --bin moonships-cli -- db migrate
          LOCO_ENV=development DATABASE_URL="$MIGRATION_POSTGRES_URL"             cargo run --quiet --bin moonships-cli -- db migrate

          sqlite3 /tmp/moonships-migrate.sqlite             "INSERT INTO organizations(name, slug, created_at, updated_at)
             VALUES(
               'Migration CI',
               'migration-ci',
               '2026-10-05T00:00:00+00:00',
               '2026-10-05T00:00:00+00:00'
             );"

          python3 scripts/migrate_sqlite_to_postgres.py             --sqlite /tmp/moonships-migrate.sqlite             --postgres "$MIGRATION_POSTGRES_URL"             --dry-run

          python3 scripts/migrate_sqlite_to_postgres.py             --sqlite /tmp/moonships-migrate.sqlite             --postgres "$MIGRATION_POSTGRES_URL"             --confirm MIGRATE

          test "$(
            psql -h localhost -U moonships -d moonships_migrate -At               -c "SELECT count(*) FROM organizations WHERE slug='migration-ci'"
          )" = "1"

  frontend-checks:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend Bundle
        working-directory: frontend
        run: npm run build
