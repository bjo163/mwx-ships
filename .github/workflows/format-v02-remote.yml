name: Format v0.2 Remote Branch

on:
  push:
    branches:
      - "feat/v0.2-remote-execution"
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - ".github/workflows/format-v02-remote.yml"

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.2-remote-execution
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust
        run: cargo fmt --all
      - name: Commit formatted sources
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests Cargo.toml
          git commit -m "style: apply rustfmt to v0.2 remote executor"
          git push origin HEAD:feat/v0.2-remote-execution
