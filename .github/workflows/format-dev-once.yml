name: One-shot format dev

on:
  push:
    branches: [ "dev" ]
    paths:
      - "src/**"
      - "tests/**"
      - "migration/**"
      - ".github/workflows/format-dev-once.yml"

permissions:
  contents: write

concurrency:
  group: format-dev-once
  cancel-in-progress: true

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatted sources
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests migration
          git commit -m "style: apply rustfmt to dev"
          git push origin HEAD:dev
