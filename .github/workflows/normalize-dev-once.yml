name: One-shot normalize dev

on:
  push:
    branches: [ "dev" ]
    paths:
      - "src/**"
      - "tests/**"
      - "migration/**"
      - "Cargo.toml"
      - ".github/workflows/normalize-dev-once.yml"

permissions:
  contents: write

concurrency:
  group: normalize-dev-once
  cancel-in-progress: true

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - run: cargo check --workspace --all-targets
      - name: Commit normalized sources and lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests migration Cargo.lock
          git commit -m "chore: normalize v0.5 close lifecycle"
          git push origin HEAD:dev
