name: Docker Build

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  docker-build:
    name: Build Multi-Stage Moonships Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: |
          export ENCRYPTION_KEY="$(openssl rand -hex 32)"
          export JWT_SECRET="$(openssl rand -hex 32)"
          docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Container Image (No Push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: moonships:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Remote Runtime Tooling
        run: docker run --rm moonships:latest ssh -V

      - name: Smoke Test Production Container
        run: |
          ENCRYPTION_KEY="$(openssl rand -hex 32)"
          JWT_SECRET="$(openssl rand -hex 32)"
          docker run -d --name moonships-smoke             -p 5150:5150             -e LOCO_ENV=production             -e HOST=http://localhost:5150             -e ENCRYPTION_KEY="$ENCRYPTION_KEY"             -e JWT_SECRET="$JWT_SECRET"             moonships:latest

          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:5150/api/health >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            docker logs moonships-smoke
            exit 1
          fi

          docker rm -f moonships-smoke
