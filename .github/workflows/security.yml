name: Security Audit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 0 * * 1' # Weekly on Monday
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  cargo-audit:
    name: Cargo Advisory Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: Dependency provenance and license metadata
        run: python3 scripts/check_dependency_policy.py

      - name: Run Advisory Audit
        # RUSTSEC-2023-0071 currently has no fixed rsa release.
        # It is an indirect dependency of jsonwebtoken pulled by Loco.
        # Moonships does not use RSA JWT algorithms; keep the advisory visible
        # in CI while accepting this documented upstream limitation.
        run: cargo audit --ignore RUSTSEC-2023-0071

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified
