name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer version to release; must match Cargo.toml"
        required: true
        type: string
  push:
    branches: [ "main" ]
    paths:
      - "Cargo.toml"
      - "CHANGELOG.md"

permissions:
  actions: read
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Validate, publish image, tag, and create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          CARGO_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          if [[ -z "$CARGO_VERSION" ]]; then
            echo "Unable to read package version from Cargo.toml" >&2
            exit 1
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            SHOULD_RELEASE=true
          else
            VERSION="$CARGO_VERSION"
            BEFORE="${{ github.event.before }}"
            PREVIOUS_VERSION=""
            if [[ -n "$BEFORE" && "$BEFORE" != "0000000000000000000000000000000000000000" ]]; then
              PREVIOUS_VERSION="$(git show "$BEFORE:Cargo.toml" 2>/dev/null | sed -n 's/^version = "\([^"]*\)"/\1/p' | head -n1 || true)"
            fi

            if [[ "$PREVIOUS_VERSION" == "$VERSION" ]]; then
              SHOULD_RELEASE=false
            else
              SHOULD_RELEASE=true
            fi
          fi

          if [[ "$VERSION" != "$CARGO_VERSION" ]]; then
            echo "Requested version ($VERSION) does not match Cargo.toml ($CARGO_VERSION)" >&2
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid SemVer: $VERSION" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"

      - name: Validate release metadata
        if: steps.version.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"

          if ! grep -Fq "## [$VERSION]" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $VERSION" >&2
            exit 1
          fi

          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists" >&2
            exit 1
          fi

      - name: Extract release notes
        if: steps.version.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"

          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md

          test -s release-notes.md

      - name: Set up Docker Buildx
        if: steps.version.outputs.should_release == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.version.outputs.should_release == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish release image
        id: build
        if: steps.version.outputs.should_release == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Attest published image provenance
        if: steps.version.outputs.should_release == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Generate SPDX SBOM
        if: steps.version.outputs.should_release == 'true'
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          artifact-name: moonships-${{ steps.version.outputs.version }}-sbom.spdx.json
          output-file: moonships-${{ steps.version.outputs.version }}-sbom.spdx.json
          upload-release-assets: false

      - name: Generate release checksums
        if: steps.version.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sha256sum "moonships-${{ steps.version.outputs.version }}-sbom.spdx.json" > SHA256SUMS

      - name: Smoke test published production image
        if: steps.version.outputs.should_release == 'true'
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_REVISION: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          ENCRYPTION_KEY="$(openssl rand -hex 32)"
          JWT_SECRET="$(openssl rand -hex 32)"

          cleanup() {
            docker rm -f moonships-release-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker pull "$IMAGE"

          test "$(docker inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "$RELEASE_VERSION"
          test "$(docker inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$RELEASE_REVISION"

          docker run -d --name moonships-release-smoke \
            -p 127.0.0.1:5150:5150 \
            -e LOCO_ENV=production \
            -e HOST=http://localhost:5150 \
            -e ENCRYPTION_KEY="$ENCRYPTION_KEY" \
            -e JWT_SECRET="$JWT_SECRET" \
            "$IMAGE"

          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:5150/api/health >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            docker logs moonships-release-smoke
            exit 1
          fi

      - name: Create annotated tag
        if: steps.version.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Moonships ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "Moonships ${{ steps.version.outputs.tag }}" \
            --notes-file release-notes.md \
            "moonships-${{ steps.version.outputs.version }}-sbom.spdx.json#SPDX SBOM" \
            "SHA256SUMS#Release checksums"
